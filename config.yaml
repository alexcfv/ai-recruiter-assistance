rate_limiter:
  min_interval: 1.2

embedder:
  model: mistral-embed
  timeout: 60

explainer:
  model: mistral-small-2603
  timeout: 60

profile_builder:
  model: mistral-small-latest
  timeout: 120

reranker:
  model: mistral-small-2603
  timeout: 120
  embedding_weight: 0.3
  llm_weight: 0.7

query_service:
  top_k_chromadb: 10

ranking:
  best_weight: 0.7
  avg_weight: 0.3

parser:
  chunk_size: 500
  overlap: 100

github:
  mcp_server_command: "npx -y @modelcontextprotocol/server-github"